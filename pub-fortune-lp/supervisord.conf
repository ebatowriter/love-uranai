[supervisord]
nodaemon=false
logfile=/home/user/webapp/pub-fortune-lp/supervisord.log
pidfile=/home/user/webapp/pub-fortune-lp/supervisord.pid

[unix_http_server]
file=/home/user/webapp/pub-fortune-lp/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/pub-fortune-lp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:fortune-server]
command=python3 /home/user/webapp/pub-fortune-lp/web_server.py
directory=/home/user/webapp/pub-fortune-lp
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/pub-fortune-lp/fortune_server.log
stderr_logfile=/home/user/webapp/pub-fortune-lp/fortune_server_error.log
